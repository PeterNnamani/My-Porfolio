<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hub — Chat Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--bg-secondary); min-height: 100vh; }
        .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
        .admin-login, .admin-app { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
        .admin-login { max-width: 400px; margin: 4rem auto; }
        .admin-login h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; }
        .admin-login input { width: 100%; padding: 0.75rem 1rem; margin: 1rem 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
        .admin-grid { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; min-height: 70vh; }
        .admin-sidebar { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .admin-sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); font-weight: 600; }
        .admin-conv-list { flex: 1; overflow-y: auto; }
        .admin-thread { border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; }
        .admin-thread-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
        .admin-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; background: var(--bg-secondary); min-height: 300px; max-height: 50vh; }
        .admin-reply { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }
        .admin-reply textarea { flex: 1; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; resize: vertical; min-height: 60px; font-family: inherit; background: var(--bg); color: var(--text); }
        .admin-empty { padding: 2rem; text-align: center; color: var(--text-muted); }
        .admin-status { padding: 0 1rem 1rem; font-size: 0.85rem; min-height: 1.25rem; }
        .admin-status.ok { color: #10b981; }
        .admin-status.err { color: #ef4444; }
        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <div id="admin-login" class="admin-login">
            <h1><i class="ri-shield-keyhole-line"></i> Admin Login</h1>
            <p style="color:var(--text-secondary);font-size:0.9rem;">Reply to website chats. Messages appear instantly for users.</p>
            <input type="password" id="admin-password" placeholder="Admin password">
            <button type="button" class="btn btn-primary" style="width:100%" id="admin-login-btn">Sign In</button>
            <p id="admin-login-error" style="color:#ef4444;font-size:0.85rem;margin-top:0.75rem;"></p>
        </div>

        <div id="admin-app" class="admin-app hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                <h1 style="font-family:'Space Grotesk',sans-serif;font-size:1.5rem;">Chat Inbox</h1>
                <button type="button" class="btn btn-ghost btn-sm" id="admin-logout">Logout</button>
            </div>
            <div class="admin-grid">
                <div class="admin-sidebar">
                    <div class="admin-sidebar-header">Conversations</div>
                    <div id="admin-conv-list" class="admin-conv-list chat-conversation-list"></div>
                </div>
                <div class="admin-thread" id="admin-thread">
                    <div class="admin-empty" id="admin-placeholder">
                        <i class="ri-chat-smile-2-line" style="font-size:2rem;"></i>
                        <p>Select a conversation to reply</p>
                    </div>
                    <div id="admin-thread-content" class="hidden" style="display:flex;flex-direction:column;flex:1;">
                        <div class="admin-thread-header">
                            <h3 id="admin-thread-title">—</h3>
                            <p id="admin-thread-meta" style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.25rem;"></p>
                            <div style="margin-top:0.75rem;display:flex;gap:0.5rem;">
                                <button type="button" class="btn btn-ghost btn-sm" id="admin-close-conv"><i class="ri-check-double-line"></i> Mark resolved</button>
                            </div>
                        </div>
                        <div id="admin-messages" class="admin-messages"></div>
                        <div class="admin-reply">
                            <textarea id="admin-reply-input" placeholder="Type your reply..."></textarea>
                            <button type="button" class="btn btn-primary" id="admin-send-reply"><i class="ri-send-plane-fill"></i></button>
                        </div>
                        <p id="admin-status" class="admin-status" aria-live="polite"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="mailer.js"></script>
    <script src="admin.js"></script>
</body>
</html>
